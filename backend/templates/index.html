<!DOCTYPE html><html><head><meta charset="utf-8"/><title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Sample frames from transcript captions; ask questions offline.</p>
<form method="post" action="/ui/jobs"><input name="title" value="Demo clip"/><textarea name="transcript" rows="3">Team enters room. Whiteboard updated. Demo ends.</textarea><button>Create job</button></form>
{% if answer %}<pre>{{ answer }}</pre>{% endif %}
<ul>{% for j in jobs %}<li>{{ j.title }} — {{ j.status }}</li>{% endfor %}</ul>
</main></body></html>
