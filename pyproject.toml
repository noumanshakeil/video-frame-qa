[project]
name = "video-frame-qa"
version = "2.0.0"
description = "Video processing jobs with sampled frame captions and LLM Q&A over frame metadata — no ffmpeg/GPU required in mock mode."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
