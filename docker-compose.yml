services:
  api:
    build: .
    container_name: video-frame-qa-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: video-frame-qa
      LLM_MODE: mock
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
